<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caixa no Buraco</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
  </head>
  <body>
    <main class="game">
      <header>
        <p class="eyebrow">Experimento 01</p>
        <h1>Caixa no Buraco</h1>
        <p class="stage" data-stage>Fase 1</p>
        <p class="status" data-status aria-live="polite"></p>
      </header>

      <section class="board" data-board aria-label="Sala do jogo"></section>

      <section class="controls" aria-label="Controles">
        <button class="up" data-direction="up" aria-label="Mover para cima">↑</button>
        <button class="left" data-direction="left" aria-label="Mover para esquerda">←</button>
        <button class="down" data-direction="down" aria-label="Mover para baixo">↓</button>
        <button class="right" data-direction="right" aria-label="Mover para direita">→</button>
      </section>

      <section class="camera-panel" aria-labelledby="camera-title">
        <div class="camera-copy">
          <p class="eyebrow">TensorFlow.js</p>
          <h2 id="camera-title">Treine seus gestos</h2>
          <p>Siga os quatro passos. Segure cada direção enquanto faz o gesto escolhido.</p>
        </div>

        <video data-webcam playsinline muted aria-label="Prévia da câmera"></video>
        <button class="camera-primary" data-camera-start>1. Ativar câmera</button>

        <div class="sample-grid" aria-label="Exemplos de movimentos">
          <p class="sample-instruction">2. Segure cada botão até completar:</p>
          <button data-sample="0" disabled>↑ Cima <span>0/10</span></button>
          <button data-sample="1" disabled>← Esquerda <span>0/10</span></button>
          <button data-sample="2" disabled>↓ Baixo <span>0/10</span></button>
          <button data-sample="3" disabled>→ Direita <span>0/10</span></button>
          <progress data-camera-progress max="100" value="0">0%</progress>
        </div>

        <div class="camera-actions">
          <button data-camera-train disabled>3. Treinar controle</button>
          <button data-camera-control disabled>4. Jogar com a câmera</button>
        </div>
        <p class="camera-status" data-camera-status aria-live="polite">
          A câmera ainda não foi ativada.
        </p>
      </section>

      <button class="reset" data-reset>Recomeçar</button>
      <p class="hint">Você também pode usar as setas do teclado.</p>
    </main>

    <script type="module" src="./src/interface/browser-app.js"></script>
  </body>
</html>
