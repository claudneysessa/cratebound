<main class="game">
  <header>
    <p class="eyebrow">Experimento 01</p>
    <h1>Caixa no Buraco</h1>
    <p class="stage" data-stage>Fase 1</p>
    <p class="status" data-status aria-live="polite"></p>
  </header>

  <section class="board" data-board aria-label="Sala do jogo"></section>

  <section class="controls" aria-label="Controles">
    <button class="up" data-direction="up" aria-label="Mover para cima">↑</button>
    <button class="left" data-direction="left" aria-label="Mover para esquerda">←</button>
    <button class="down" data-direction="down" aria-label="Mover para baixo">↓</button>
    <button class="right" data-direction="right" aria-label="Mover para direita">→</button>
  </section>

  <button class="reset" data-reset>Recomeçar</button>
  <p class="hint">Você também pode usar as setas do teclado.</p>
</main>
